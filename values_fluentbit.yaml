affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: env
          operator: In
          values:
          - PRD
config:
  customParsers: |
    # CRI Parser
    [PARSER]
        Name        cri_custom
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<date>[^ ]*) (?<timestamp>[^ ]*)\s* (?<level>[^ ]*) (?<pid>[^ ]*)\s*--- (?<thread>[^ ]*) (?<class>[^ ]*)\s*\:(?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name multiline
        Format regex
        Regex /(?<timestamp>\d{2}:\d{2}:\d{2},\d{3})\s*(?<level>INFO|ERROR|WARN|WARNING|TRACE|DEBUG|FATAL|SEVERE)\s*\[(?<class>[^\]]+)]\s*(?<thread>\(.*\))\s+(?<message>.*?)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}|\Z)/
        Time_Key  time
        Time_Format %b %d %H:%M:%S

    [PARSER]
        Name binarios_multiline
        Format regex
        Regex /(?<date>\d{4}-\d{2}-\d{2})\s*\s*(?<time>\d{2}:\d{2}:\d{2}\.\d{3})\s+(?<level>[^\s]+)\s+(?<pid>\d+).?\s*---\s*\[(?<thread>[^\]]+)]\s*(?<class>.*)\s:\s+(?<message>.*)/
        Time_Key  time
        Time_Format %H:%M:%S
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_Tag_Prefix kube.myservice.var.log.containers
        Buffer_Size 256KB
        Merge_Log On
        Merge_Log_Trim On
        Labels On
        Annotations On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
    [FILTER]
        Name lua
        Match kube.myservice.*
        Call append_request_time
        Code function append_request_time(tag, timestamp, record) new_record=record if new_record["class"] == "b.j.c.p.b.servico.BinariosApiServico" then new_record["request_time"]=string.match(new_record["message"], '.tempo%(ms%): (%d+)') return 2, timestamp, new_record else return 0, timestamp, new_record end end
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*pje-binarios-standalone*.log
        Parser cri_custom
        # Multiline On
        # Parser_Firstline binarios_multiline
        Tag kube.myservice.*
        Read_from_head true
        Mem_Buf_Limit 50MB
        Skip_Long_Lines Off
        Skip_Empty_Lines On
        Ignore_Older      1d
  outputs: |
    [OUTPUT]
        Name es
        Match kube.myservice.*
        Host ${ELASTIC_HOST}
        Port  ${ELASTIC_PORT}
        Retry_Limit False
        HTTP_User       ${ELASTIC_USER}
        HTTP_Passwd     ${ELASTIC_PASS}
        Logstash_Format On
        Logstash_Prefix logs
        # Logstash_Prefix_Key $kubernetes['namespace_name']
        Trace_Error       Off
        Trace_Output      Off       
        Suppress_Type_Name On     
        tls On
        tls.verify Off
        tls.ca_file /fluent-bit/etc/certs/http_ca.crt
  service: |
    [SERVICE]
        Daemon Off
        Flush {{ .Values.flush }}
        Log_Level {{ .Values.logLevel }}
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port {{ .Values.metricsPort }}
        Health_Check On
  upstream: {}
env:
- name: TZ
  value: America/Recife
- name: ELASTIC_USER
  valueFrom:
    secretKeyRef:
      key: username
      name: elastic-creds
- name: ELASTIC_PASS
  valueFrom:
    secretKeyRef:
      key: password
      name: elastic-creds
- name: ELASTIC_HOST
  valueFrom:
    secretKeyRef:
      key: host
      name: elastic-creds
- name: ELASTIC_PORT
  valueFrom:
    secretKeyRef:
      key: port
      name: elastic-creds
extraVolumeMounts:
- mountPath: /fluent-bit/etc/certs
  name: es-ca-vol
  readOnly: true
extraVolumes:
- name: es-ca-vol
  secret:
    secretName: elasticsearch-external
image:
  digest: null
  pullPolicy: Always
  repository: cr.fluentbit.io/fluent/fluent-bit
  tag: 2.1.10-debug
luaScripts:
  filter_request_time.lua: |
    function append_request_time(tag, timestamp, record)
        new_record=record
        if new_record["class"] == "b.j.c.p.b.servico.BinariosApiServico"
          new_record["request_time"]=string.match(new_record["message"], '.tempo%(ms%): (%d+)')
          return 2, timestamp, new_record
        else
          return 0, timestamp, new_record
        end
    end  
openShift:
  enabled: true
  securityContextConstraints:
    annotations: {}
    create: false
    existingName: logging
    name: ""
securityContext:
  privileged: true
